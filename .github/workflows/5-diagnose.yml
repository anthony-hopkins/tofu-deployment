name: 5 · Diagnose

# Read-only health report. Changes nothing.
#
# Two independent jobs:
#   report — Vultr API only (account, instance state, port probes, snapshot
#            coverage, orphans). Never opens OpenTofu state, so it works even
#            when state is locked or broken.
#   drift  — optional `tofu plan` to answer "does reality still match the
#            config?". Takes the state lock, so it is gated behind an input.

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Limit the report to one instance key (blank = whole fleet)"
        type: string
        default: ""
      ports:
        description: Comma-separated TCP ports to probe on each instance
        type: string
        default: "22"
      max_snapshot_age:
        description: "Flag instances whose newest snapshot is older than N days (blank = don't check)"
        type: string
        default: ""
      check_drift:
        description: Also run a plan to detect configuration drift
        type: boolean
        default: true
      fail_on_problem:
        description: Fail the run when problems are found
        type: boolean
        default: true

  # Uncomment to also get a report every morning.
  # schedule:
  #   - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  report:
    name: Health report
    runs-on: ubuntu-latest

    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      PROJECT: ${{ vars.PROJECT || 'containerlabs' }}

    steps:
      - uses: actions/checkout@v7

      - name: Diagnose
        env:
          INSTANCE: ${{ inputs.instance }}
          PORTS: ${{ inputs.ports || '22' }}
          MAX_SNAPSHOT_AGE: ${{ inputs.max_snapshot_age }}
          FAIL_ON_PROBLEM: ${{ inputs.fail_on_problem }}
        run: |
          set -euo pipefail

          args=(--ports "${PORTS}")

          if [ -n "${INSTANCE}" ]; then
            args+=(--instance "${INSTANCE}")
          fi
          if [ -n "${MAX_SNAPSHOT_AGE}" ]; then
            args+=(--max-snapshot-age "${MAX_SNAPSHOT_AGE}")
          fi
          # A scheduled run has no inputs; default to not failing there.
          if [ "${FAIL_ON_PROBLEM}" != "true" ]; then
            args+=(--no-fail)
          fi

          bash scripts/diagnose.sh "${args[@]}"

  drift:
    name: Drift check
    if: inputs.check_drift
    runs-on: ubuntu-latest

    # Only this job touches state, so only this job queues behind
    # plan / apply / destroy.
    concurrency:
      group: containerlabs-tofu-state
      cancel-in-progress: false

    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_SECRET_KEY }}
      TF_IN_AUTOMATION: "1"

      # This job plans directly instead of calling _tofu-plan.yml, so it has
      # to set the same naming variable. Without it the drift plan derives
      # "<key>.<dns_zone>" and reports a hostname change that is not real.
      TF_VAR_instance_hostname: ${{ vars.HOSTNAME }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/tofu-init
        with:
          tofu-version: ${{ vars.TOFU_VERSION || '1.12.5' }}
          bucket: ${{ vars.TFSTATE_BUCKET }}
          region: ${{ vars.TFSTATE_REGION }}
          endpoint: ${{ vars.TFSTATE_ENDPOINT }}

      - name: Validate configuration
        run: |
          tofu fmt -check -recursive -diff
          tofu validate -no-color

      - name: Plan for drift
        id: drift
        env:
          FAIL_ON_PROBLEM: ${{ inputs.fail_on_problem }}
        run: |
          # See the note in _tofu-plan.yml: run steps are `bash -e {0}`, and
          # -detailed-exitcode's 2 is an expected result, not a failure.
          set +e
          set -uo pipefail

          tofu plan -detailed-exitcode -input=false -no-color -lock-timeout=5m \
            -out=drift.plan 2>&1 | tee drift.txt
          code=${PIPESTATUS[0]}

          # Exit 2 only means "the plan is not empty", which covers three very
          # different situations. Split the changes apart to tell them apart:
          #   creates  -- resources in config that do not exist yet. Expected
          #               between merging config and running 2 · Apply, so it
          #               never fails the run.
          #   modifies -- updates/replacements/deletes of resources that DO
          #               exist in state: real drift (portal edits, or edits to
          #               already-applied config).
          #   neither  -- the plan would only record output values in state.
          #               Normal before the first apply.
          creates=0
          modifies=0
          if [ -f drift.plan ] && tofu show -json drift.plan >drift.json 2>/dev/null; then
            creates="$(jq '[.resource_changes[]? | .change.actions
              | select(. == ["create"])] | length' drift.json 2>/dev/null || echo 0)"
            modifies="$(jq '[.resource_changes[]? | .change.actions
              | select(. != ["no-op"] and . != ["create"] and . != ["read"])] | length' drift.json 2>/dev/null || echo 0)"
          fi
          # Guard the arithmetic tests below against empty or odd values.
          case "${creates}" in ''|*[!0-9]*) creates=0 ;; esac
          case "${modifies}" in ''|*[!0-9]*) modifies=0 ;; esac

          verdict=ok
          [ "${code}" = "1" ] && verdict=error
          if [ "${code}" = "2" ]; then
            if [ "${modifies}" -gt 0 ]; then
              verdict=drift
            elif [ "${creates}" -gt 0 ]; then
              verdict=pending
            else
              verdict=outputs
            fi
          fi

          {
            echo "## Drift check"
            echo
            case "${verdict}" in
              ok)
                echo ":white_check_mark: **No drift.** The live fleet matches the configuration and state."
                ;;
              outputs)
                echo ":white_check_mark: **No resource drift.** The plan is non-empty, but only because it would record output values in state — no infrastructure would change. This is normal before the first apply."
                ;;
              pending)
                echo ":hourglass_flowing_sand: **No drift — ${creates} pending create(s).** New configuration is waiting for its first apply; nothing that already exists would change. Run **2 · Apply** to create it. (Note: an instance deleted outside OpenTofu also reappears here as a create after the state refresh.)"
                ;;
              drift)
                echo ":warning: **Drift detected — ${modifies} change(s) to existing resources.** Either something was changed in the Vultr portal, or an edit to already-applied configuration has not been applied yet."
                if [ "${creates}" -gt 0 ]; then
                  echo
                  echo "The plan also contains ${creates} pending create(s) — new, not-yet-applied configuration. Those alone would not fail this check."
                fi
                ;;
              error)
                echo ":x: **The plan failed.** See the output below."
                ;;
            esac
            echo
            echo "<details><summary>Plan output</summary>"
            echo
            echo '```hcl'
            head -c 60000 drift.txt 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

          # Drift is a finding, not a crash. Surface it as failure only when
          # asked, and never for pending creates or an output-only plan --
          # "not applied yet" is expected behavior, not a problem.
          [ "${verdict}" = "error" ] && exit 1
          if [ "${verdict}" = "drift" ] && [ "${FAIL_ON_PROBLEM}" = "true" ]; then
            exit 1
          fi
          exit 0
